<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>税込価格計算</title>
    <style>
      body {
        max-width: 480px;
        margin: 64px auto;
        padding: 0 20px;
        font-family: sans-serif;
        line-height: 1.8;
      }
      label {
        display: block;
        margin-top: 16px;
      }
      input, select, button {
        padding: 8px;
        font: inherit;
      }
      button {
        display: block;
        margin-top: 24px;
      }
      #result {
        font-size: 24px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>税込価格をかんたん計算</h1>

    <form id="calculator">
      <label for="price">税抜価格（円）</label>
      <input id="price" type="number" min="0" step="1"
             value="1000" required>

      <label for="tax-rate">税率</label>
      <select id="tax-rate">
        <option value="10">10%</option>
        <option value="8">8%</option>
      </select>

      <button type="submit">計算する</button>
    </form>

    <p id="result" aria-live="polite">価格を入力して計算してください。</p>

    <script type="module" src="./app.js"></script>
  </body>
</html>
