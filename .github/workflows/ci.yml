name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: "0"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 依存パッケージをインストール
        run: npm ci

      - name: テストを実行
        run: npm test

      # npm ciで入るのはライブラリなので、
      # CIの実行マシンにもブラウザ本体と必要なOSパッケージを入れる
      - name: テスト用ブラウザを準備
        run: npx playwright install --with-deps chromium

      # PlaywrightのwebServer設定がビルドとサーバー起動も行う
      # ここで失敗するとTestジョブが失敗し、マージ・公開を止める
      - name: ブラウザ操作をテスト
        run: npm run test:e2e 

      # テストに失敗しても、調査に必要なレポートは保存する
      # キャンセルされた実行では保存処理を省く
      - name: ブラウザテストのレポートを保存
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore 

      - name: 公開用ファイルを保存
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    concurrency:
      group: github-pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: GitHub Pagesを設定
        uses: actions/configure-pages@v5

      - name: GitHub Pagesへ公開
        id: deployment
        uses: actions/deploy-pages@v4