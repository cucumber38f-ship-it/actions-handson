name: CI

on:
  push: 
    branches: [main]
  pull_request: 
    branches: [main]
  workflow_dispatch: 

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env: 
      HUSKY: "0"
    
    steps: 
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4
      
      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
        
      - name: 依存パッケージをインストール
        run: npm ci 
      
      - name: テストを実行
        run: npm test 