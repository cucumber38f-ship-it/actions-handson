name: Site Check

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch: 
    
permissions:
  contents: read 

jobs:
  check:
    name: Check published site
    runs-on: ubuntu-latest
    timeout-minutes: 10 

    env:
      # CIではGitフックを設定しない
      HUSKY: "0"
      # GitHubの設定値を、Playwrightが読む環境変数へ渡す
      BASE_URL: ${{ vars.SITE_URL }}
    
    steps:
      # 空だとローカルテストに切り替わってしまうため、
      # 公開URLが設定されていない場合は、明示的に失敗させる
      - name: 公開URLの設定を確認
        shell: bash
        run: |
          if [[ -z "${BASE_URL//[:space:]}" ]]; then
            echo "::error::VariablesにSITE_URLを登録してください"
            exit 1
          fi 
      
      # 公開ページとは別に、操作手順を書いたテストコードを取得する
      - name: テストコードを取得
        users: actions/checkout@v4

      - name: Node.jsを準備
        uses: actions/setup-node@v4 
        with: 
          node-version: "22"
          cache: npm 
        
      # lockファイルと同じバージョンの依存パッケージを入れる
      - name: 依存パッケージをインストール
        run: npm ci 

      # ブラウザ本体と、Linuxでの実行に必要なパッケージを入れる
      - name: Chromiumを準備
        run: npx playwright install --with-deps chromium 

      # BASE_URLがあるため、ビルドやローカルサーバー起動は行わず、
      # 公開サイトにアクセスして、4パターンを確認する
      - name: レポートを保存
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with: 
          name: live-site-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore 