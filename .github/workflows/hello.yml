name: Hello Actions

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  hello:
    runs-on: ubuntu-latest

    steps: 
      - name: 挨拶を表示
        run: echo "Hello, GitHub Actions!"

      - name: 実行環境を確認
        run: |
          echo "実行ユーザー"
          whoami 
          echo "現在のフォルダ"
          pwd
          echo "OSの情報"
          uname -a 
          
      - name: 学習メモを表示
        run: echo "commitではHusky、手動実行ではGitHub Actionsが動いた"
